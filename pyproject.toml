[project]
name = "adeval"
version = "0.2.0"
# Hydra bug in 3.14, Ray in beta for 3.13
requires-python = ">=3.10"
dependencies = [
    "rich",
    "py123d[av2, nuplan, nuscenes] >= 0.7.0",
    "huggingface-hub >= 2.1.1",
    "nuplan-devkit @ git+https://github.com/motional/nuplan-devkit@nuplan-devkit-v1.2",
    # Must be specified to prevent dependency resolution failure
    "numpy<2",
    "aioboto3 >= 15.5.0",
    "torch == 2.8.*",
    "torchvision == 0.23.*",
    "spconv-cu120",
    "fpdf2",
    "av2 == 0.2.0",
    "kornia < 0.7",
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["build", "pytest", "ruff", "ninja"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
