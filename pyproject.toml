[project]
name = "adeval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["rich", "py123d"]

[project.optional-dependencies]
dev = ["build", "pytest", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
