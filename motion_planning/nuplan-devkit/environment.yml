name: nuplan
channels:
  - conda-forge
dependencies:
  - python=3.9
  # >=23 for a resolver fast enough not to hang for 30+ minutes on this
  # requirement set (pip 21.2.4's resolver does); <24.1 because hydra-core==
  # 1.1.0rc1 pins omegaconf==2.1.0.rc1, whose metadata has a malformed
  # version specifier that pip started hard-rejecting in 24.1.
  - pip>=23,<24.1
  - nb_conda_kernels
  # pytorch-lightning==1.3.8 pins PyYAML<=5.4.1, which has no macOS arm64
  # wheel on PyPI and fails to build from source under modern setuptools
  # (removed Cython build_ext compat shim). conda-forge ships a native
  # osx-arm64 build, so install it here and pip will see it already
  # satisfied instead of trying to compile it.
  - pyyaml<=5.4.1
  - pip:
    - -r requirements_torch.txt
    - -r requirements.txt
